<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre Azul Interactivo</title>
  <style>
    :root {
      --color-sobre: #0a1f44;
      --color-sobre-flap: #0f2a5c;
      --color-hoja: #ffffff;
      --color-texto: #333333;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #e2e8f0;
      font-family: 'Times New Roman', Times, serif;
      overflow: hidden;
    }

    #abrir-sobre {
      display: none;
    }

    .wrapper {
      position: relative;
      width: 300px;
      height: 200px;
      cursor: pointer;
      perspective: 1000px;
    }

    .envelope {
      width: 100%;
      height: 100%;
      background-color: var(--color-sobre);
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    /* Solapa superior */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 100px solid var(--color-sobre-flap);
      transform-origin: top;
      /* Transición más lenta para la solapa */
      transition: transform 0.8s ease-in-out;
      z-index: 4;
    }

    /* Bolsillo del sobre */
    .pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid var(--color-sobre);
      border-right: 150px solid var(--color-sobre);
      border-bottom: 100px solid var(--color-sobre);
      border-radius: 0 0 8px 8px;
      z-index: 3;
    }

    /* La Carta */
    .letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 270px;
      height: 170px;
      background-color: var(--color-hoja);
      border-radius: 6px;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      z-index: 2;
      overflow: hidden;
      opacity: 0.8;
      /* Animación global más lenta y fluida */
      transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .letter-content {
      opacity: 0;
      /* El texto aparece progresivamente más despacio */
      transition: opacity 0.6s ease 0.8s;
      text-align: left;
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--color-texto);
    }

    .letter-content h1 {
      text-align: center;
      color: #0a1f44;
      margin-top: 0;
    }

    /* --- ANIMACIONES AL ABRIR --- */

    /* 1. Abrir solapa lentamente */
    #abrir-sobre:checked + .wrapper .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* 2. Expandir la hoja centrada y un poco más pequeña */
    #abrir-sobre:checked + .wrapper .letter {
      z-index: 100;
      position: fixed;
      
      /* Posicionamiento exacto al centro de la pantalla */
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      
      /* Un poco más chiquita (75% de la pantalla) */
      width: 350px;
      height: 450px;
      
      bottom: auto;
      margin: 0;
      opacity: 1;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      overflow-y: auto;
    }

    /* 3. Mostrar el contenido */
    #abrir-sobre:checked + .wrapper .letter .letter-content {
      opacity: 1;
    }
  </style>
</head>
<body>

  <input type="checkbox" id="abrir-sobre">

  <label for="abrir-sobre" class="wrapper">
    <div class="envelope">
      <div class="flap"></div>
      
      <div class="letter">
        <div class="letter-content">
         
 
          <p>

        </div>
      </div>

    </div>
  </label>

</body>
</html>
